[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-curb-digital-twin"
version = "0.1.0"
description = "Multi-agent discrete-event digital twin of urban curb space with competing passenger, freight and ridehail demand, plus calibration and curb-allocation optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhishek Soundalgekar" }]
keywords = ["curb management", "parking", "ridehail", "freight", "simulation", "digital twin", "SUMO", "SimPy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "simpy>=4.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "plotly>=5.18",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
geo = ["geopandas>=0.14", "shapely>=2.0"]
sumo = ["traci>=1.18", "sumolib>=1.18"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.1",
]

[project.scripts]
curb-run = "src.experiments.runner:main"
curb-optimize = "src.optimization.optimizer:main"
curb-calibrate = "src.calibration.calibrate:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that run a full simulation replication",
    "sumo: marks tests that require a working SUMO installation",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.coverage.run]
source = ["src"]
omit = ["src/sumo/*", "src/viz/dashboard.py"]
